name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit & component tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Providers fall back to mock when keys/hosts are absent; CI builds offline.
          NEXT_TELEMETRY_DISABLED: "1"

      # E2E is intentionally omitted here — it needs Playwright browser binaries.
      # Add a separate job with `npm run e2e:install && npm run e2e` when desired.
